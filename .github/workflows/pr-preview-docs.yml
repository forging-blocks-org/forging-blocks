name: Deploy PR Preview Docs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.event.action == 'closed' && 'gh-pages' || format('preview-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Poetry
        if: github.event.action != 'closed'
        uses: ./.github/actions/setup-poetry

      - name: Install documentation dependencies
        if: github.event.action != 'closed'
        run: |
          poetry install --no-interaction --with docs

      - name: Generate documentation pages
        if: github.event.action != 'closed'
        run: |
          poetry run python scripts/generate_autodoc_pages.py

      - name: Build documentation site
        if: github.event.action != 'closed'
        run: |
          poetry run mkdocs build --strict

      - name: Deploy PR preview
        if: github.event.action != 'closed'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: true
          qr-code: true
          wait-for-pages-deployment: false

      - name: Remove PR preview
        if: github.event.action == 'closed'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          comment: false
          wait-for-pages-deployment: false
